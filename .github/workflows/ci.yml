# Every push and pull request: the fast tiers. A push to main also runs each platform's
# device tiers, so main is always known to be releasable.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  gate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            runner: macos-latest
          - platform: android
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/ci/prepare-gate.sh ${{ matrix.platform }}
      - run: bash scripts/ci/gate.sh ${{ matrix.platform }}
