# Throwaway (remote-releases.md step 6): measures the device tiers on hosted runners.
# Each platform runs three jobs at once, all cold: nothing here could ever save a cache
# (remote-releases.md step 6, open item 5), so step 7's ci.yml owns caching instead.
# Delete this file when step 7's workflows land.
name: measure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/measure.yml, scripts/ci/**, scripts/lib/**, apps/mobile/**]

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 150
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/ci/install-maestro.sh
      - run: bash scripts/ci/measure-gate.sh ios

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/ci/android-host.sh
      - run: bash scripts/ci/install-maestro.sh
      - run: bash scripts/ci/measure-gate.sh android
