# Throwaway (remote-releases.md step 6): measures the device tiers on hosted runners.
# Each platform runs three times in sequence: run 1 is cold, runs 2-3 restore its cache.
# Delete this file when step 7's workflows land.
name: measure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/measure.yml, scripts/ci/**, scripts/lib/**]

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 150
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@v4
        with:
          key: ios-measure-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app.json') }}
          path: |
            apps/mobile/ios
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/CocoaPods
            ~/.expo
      - run: bash scripts/ci/install-maestro.sh
      - run: bash scripts/ci/measure-gate.sh ios
      - uses: actions/cache/save@v4
        if: always()
        with:
          key: ios-measure-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app.json') }}
          path: |
            apps/mobile/ios
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/CocoaPods
            ~/.expo

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@v4
        with:
          key: android-measure-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app.json') }}
          path: |
            apps/mobile/android
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.expo
      - run: bash scripts/ci/android-host.sh
      - run: bash scripts/ci/install-maestro.sh
      - run: bash scripts/ci/measure-gate.sh android
      - uses: actions/cache/save@v4
        if: always()
        with:
          key: android-measure-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app.json') }}
          path: |
            apps/mobile/android
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.expo
