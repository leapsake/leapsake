# Recording a gift beside the person it is for, and ticking it off on their page.
#
# The staged Gifts section is the one place a gift is typed *beside* the record
# it belongs to, rather than on the standalone capture screen — and the only
# place the two halves of a gift row meet: the shared identity fields
# (`GiftIdentityFields`, a name-or-link input) and the recipient's own tick
# (`GiftGivenCheckbox`).
#
# Three claims, none of which a lower tier can make. The repo and core tests
# prove the write does the right thing when asked; this proves the screens ask.
#
#   1. "Add gift" on the create form appends an **open row** — no sub-form, no
#      `Cancel  Add` — and the form's one Save writes what is in it.
#   2. The gift lands on the person's page, marked not-given.
#   3. The row's own ✓/○ on that page marks it given, with no form and no Save,
#      and the page reads it back that way.
#
# Case 3 used to reopen the record's whole form to reach a switch. That form is
# gone: a gift link is ticked or it isn't, so there is no draft to hold back and
# the tick writes where it stands. It is asserted through the toggle's
# accessibility label rather than the ✓/○ glyph, because the label is what a
# screen reader is given and the glyph is inside it.
#
# Verify non-vacuous by sabotage: make `applyEntityForm` skip `value.gifts` and
# case 2 goes red; make `GiftsSection`'s `setGiven` a no-op and case 3 does.
#
# Like the other flows here it deliberately does not `launchApp`: a cold
# dev-client launch lands on the launcher, and these routes only exist once JS
# is loaded. Open the app to its home screen against a running Metro first.
#
#   maestro --udid <sim> test staged-gifts.yaml
#
# It leaves a person and a gift idea behind (dev data on a simulator), so both
# carry a per-run tag: with fixed names, run N leaves the Nth copy for the
# duplicate detector to score and for the idea typeahead to offer.
appId: com.leapsake.app
---
- evalScript: ${output.run = Date.now() % 1000000}

# ── 1. Somebody to give something to ────────────────────────────────────────
- runFlow:
    file: subflows/add-person.yaml
    env:
      FIRST: "Zuzu${output.run}"
      LAST: "Bailey${output.run}"

# ── 2. Stage a gift on the same form ────────────────────────────────────────
# The link appends a row that is already open, in the space the link occupied —
# the fields below are that row's, with no sub-form to wait for.
- scrollUntilVisible:
    element:
      text: "Add gift"
    direction: DOWN
- tapOn: "Add gift"
- tapOn:
    id: "gift-title"
- inputText: "Kite${output.run}"
- runFlow:
    file: subflows/dismiss-keyboard.yaml
    env:
      ANCHOR: "Milestones"
# The row's identity line takes the name as it is typed, which is how we know
# the draft reached the section's state rather than only the input.
- assertVisible: "Kite${output.run}"
- runFlow:
    file: subflows/save-record.yaml

# ── 3. It reads back on the page, not yet given ─────────────────────────────
- scrollUntilVisible:
    element:
      text: "Kite${output.run} — not given yet"
    direction: DOWN

# ── 4. Tick it off, on the row ──────────────────────────────────────────────
- tapOn: "Kite${output.run} — not given yet"
- assertVisible: "Kite${output.run} — given"
- assertNotVisible: "Kite${output.run} — not given yet"
