# Flow 7c — the password door: the way back into a locked store.
# plans/testing/crucial-flows.md → Flow 7, variant 7c. Runs at the `rc` rung.
#
# **What this proves that no lower tier can.** The doors' independence is covered a tier
# down — `apps/desktop/test/open.test.ts` → *the password door* asserts it directly — but
# that is desktop's `openAppDatabase`. Mobile's is a different implementation in a
# different runtime: the unlock loop in `../../lib/core-context.tsx`, which runs
# **before the database opens**. Nothing below E2E boots through it, so a bug there is not
# a failed query, it is an app that will not start.
#
# It is also the automated form of the transfer-day rehearsal in `plans/shipping.md` →
# Part 2. Moving the App Store record to the company changes the signing principal, every
# enclave key becomes unreadable at once, and this door is what makes that cost one
# password entry instead of a phrase hunt (`packages/key-custody/README.md`).
#
# **After `04` in the arc, whose end state is exactly this flow's preconditions:** an
# Authenticated store holding Mary, George, a milestone and a reminder, sealed under the
# password `04` already types. Nothing here re-types a username or re-creates an account.
#
# ---
#
# ## What Act 2 asserts, and the one thing it deliberately does not
#
# The catalog asks 7c to end by proving the *phrase* door still works, because a password
# unlock is **not read-only on the phrase sidecar**: the boot path rewrites the recovery
# door (`core-context.tsx`, `writeRecovery` after the unlock) and `convergeRecoveryKey`
# writes it again. A shared-state bug there is invisible until someone needs the second
# door, which is the day they have already forgotten their password.
#
# Act 2 proves everything about that reachable from here: the gate still **offers** the
# phrase door (that link renders only from `doors.phrase`, which is a live read of the
# sidecar), a well-formed phrase is **read and rejected** by the sidecar itself, and the
# password still opens the store afterwards. What it cannot prove is that the *right*
# phrase opens it — and the reason is structural, not a matter of effort:
#
# > **Flows do not share variables.** `scripts/lib/mobile-harness.mjs` runs `maestro test
# > <file>` once per flow, so `output.*` and `maestro.copiedText` die with each flow's
# > process. The 24 words are shown once, on `04`'s reveal, in a different process. Neither
# > stitching 24 `copyTextFrom` calls nor the reveal's own **Copy** button bridges that:
# > Maestro's `pasteText` replays *its own* `copiedText`, never the device pasteboard.
#
# So the right-phrase clause belongs to **7b**, which creates its own account so that the
# reveal and the door share one process. ✅ **It is built** (`07b-phrase-door.yaml`, last in
# the arc, 2026-09-09) — this was a scheduled deferral with a known shape, not a silent one,
# and it is now closed.
#
# ## The budget, and why it is what it is
#
# **Three Argon2id passes**, and a wrong password costs exactly what a right one does — the
# password sidecar carries its own salt, so there is no cheap early rejection. Each is the
# same 19MiB memory-hard pass on unJITted Hermes that `04` documents at 48-85s typical and
# **294.5s** at the worst degradation ever measured on this hardware. So every unlock wait
# below carries `04`'s budget verbatim, for `04`'s reason: what has to be covered is not
# the derivation but the machine it is sharing, and this flow runs last in a suite that has
# already spent twenty minutes driving a device.
#
# **Measured on the first green** (iPhone 16 Pro simulator, iOS 26.5, 2026-09-09): the three
# unlocks took 25.3s, 25.5s and 25.5s, and the whole flow 2m46s. The wrong **phrase**, by
# contrast, came back in **0.12s** — that door unwraps raw key material and derives nothing,
# which is why its wait below is 60s rather than eight minutes.
#
# ⚠️ **Do not turn any of these into a `repeat` of shorter waits.** Inside a `repeat`,
# Maestro honours `extendedWaitUntil`'s timeout on the *first* iteration only — measured
# 2026-09-05 on `04`, where a 60s × 8 loop went red at 75s believing it had waited eight
# minutes.
#
# If this flow ever has to get cheaper, the final unlock (step 13) is the one to drop: it
# is the "a failed attempt corrupts nothing" evidence and the courtesy of leaving the
# device usable, and it is the only step here that is not load-bearing for a catalog claim.
appId: com.leapsake.app
---
# =========================================================================================
# Act 1 — the password door
# =========================================================================================

# --- simulate the OS key-store reset ----------------------------------------------------
# `dev-clear-dbkey` deletes **only** `DATABASE_KEY` from expo-secure-store, leaving the
# encrypted store, both door sidecars and the recovery key intact — which is the whole
# point of the route, and why a reinstall cannot stand in for it (a reinstall wipes the
# store too, so there is nothing to recover into). `__DEV__`-gated and deep-link only.
- openLink: "leapsake://dev-clear-dbkey"
# Positive, never `assertNotVisible` on the button's own label: the button reads "Clear
# db-key" until the tap takes effect, so the negative would pass just as happily against a
# tap that did nothing — the trap `../subflows/factory-reset.yaml` records at length.
- runFlow:
    file: ../subflows/tap-checked-text.yaml
    env:
      TARGET: "dev-clear-dbkey-button"
      EXPECT: "Keychain cleared"

# --- the gate comes up on the next launch ------------------------------------------------
- runFlow: ../subflows/relaunch.yaml
# 120s, matching the harness's own `HOME_TIMEOUT_MS`: a **cold** dev-client launch fetching
# the whole bundle from Metro, which has nothing to do with how fast the app is.
- extendedWaitUntil:
    visible:
      id: "recovery-gate"
    timeout: 120000

# The password door leads, and it is the door on screen — asserted by the body copy, which
# is the only text that differs between the two. `RecoveryGate` prefers the password
# whenever the store has one, and leading with the phrase would be backwards.
- assertVisible: ".*Enter your password to unlock it.*"

# **Both sidecars survived the reset**, which is the precondition Act 2 depends on and is
# cheaper to assert here than to discover as a confusing red later. This link renders only
# when `doors.phrase` is true — a live read of the recovery sidecar off `doors.db`.
- assertVisible: "Forgot your password\\? Use your 24-word recovery phrase"

# --- the negative, first ------------------------------------------------------------------
# First because it is the half that a door which checks nothing still passes, and because
# getting it out of the way means a broken build fails on the cheaper end of the flow.
- tapOn:
    id: "recovery-secret"
- inputText: "not-the-password-at-all"
- runFlow:
    file: ../subflows/dismiss-keyboard.yaml
    env:
      ANCHOR: "Unlock your data"
- tapOn:
    id: "recovery-submit"

# --- fifteen seconds of insurance against eight minutes of the wrong question -------------
# The same guard `04` carries before its reveal, for the same reason. `submit()` returns
# early when the field is empty, leaving the button reading "Unlock" and the app doing
# nothing at all — so a tap that typed into nothing (the classic secure-field failure)
# would otherwise spend the whole Argon2id budget below waiting for an error that was never
# coming, and report *that* as the failure.
#
# Waited for rather than asserted: the tap returns as soon as the hierarchy changes, which
# on a loaded machine is before React has committed the button's re-render.
- extendedWaitUntil:
    visible: "Checking…"
    timeout: 15000

# The error is the assertion. It is specific to the door — the phrase door has its own
# wording — so it also proves the submit carried the right `door` with it.
- extendedWaitUntil:
    visible: ".*That password doesn't open this database.*"
    timeout: 480000
# The form came back rather than the app wedging on "Checking…" forever. This is the
# regression the `useEffect` keyed on `onSubmit` rather than on `error` exists to prevent,
# and two wrong passwords in a row is exactly when someone is trying hardest to get in.
- assertVisible:
    id: "recovery-gate"
- assertVisible: "Unlock"

# --- and now the right one ----------------------------------------------------------------
# `eraseText` first: the field keeps the rejected attempt, and appending to it would fail
# on a password that was never typed. The tap lands past the text and short of the Show
# button, so the caret sits at the end and the erase takes all of it.
- tapOn:
    id: "recovery-secret"
    point: "70%,50%"
- eraseText
- inputText: "correct-horse-battery-staple"
- runFlow:
    file: ../subflows/dismiss-keyboard.yaml
    env:
      ANCHOR: "Unlock your data"
- tapOn:
    id: "recovery-submit"
- extendedWaitUntil:
    visible: "Checking…"
    timeout: 15000

# The store opened: the gate is gone and the app booted the rest of the way to its shell.
- extendedWaitUntil:
    visible:
      id: "tab-search"
    timeout: 480000

# --- the data came back with it ------------------------------------------------------------
# The point of the flow, and the same tail `04` uses — Mary, her birthday and her
# relationship, read out of a store whose key was just reconstructed from a password.
- runFlow:
    file: ../subflows/tap-checked.yaml
    env:
      TARGET: "tab-search"
      EXPECT: "browse-tile-people"
- tapOn:
    id: "browse-tile-people"
- assertVisible: ".*Mary Bailey.*"
- tapOn: ".*Mary Bailey.*"
- scrollUntilVisible:
    element:
      text: ".*Birthday.*"
    direction: DOWN
- assertVisible: ".*1815.*"
- assertVisible: ".*George Bailey.*"

# =========================================================================================
# Act 2 — the phrase door survived the password unlock
# =========================================================================================

- openLink: "leapsake://dev-clear-dbkey"
- runFlow:
    file: ../subflows/tap-checked-text.yaml
    env:
      TARGET: "dev-clear-dbkey-button"
      EXPECT: "Keychain cleared"
- runFlow: ../subflows/relaunch.yaml
- extendedWaitUntil:
    visible:
      id: "recovery-gate"
    timeout: 120000

# **The claim this act exists for.** The password unlock above rewrote the recovery
# sidecar on its way through the boot path; this link renders only if that sidecar is
# still readable afterwards. A password unlock that clobbered it fails right here, one
# assertion after the act that would have caused it.
- assertVisible: "Forgot your password\\? Use your 24-word recovery phrase"
- runFlow:
    file: ../subflows/tap-text-checked.yaml
    env:
      TARGET: "Forgot your password\\? Use your 24-word recovery phrase"
      EXPECT: ".*Enter your recovery phrase to unlock it.*"
- assertVisible: ".*Enter your recovery phrase to unlock it.*"

# --- the sidecar is read, not merely present ----------------------------------------------
# **The phrase below is valid BIP39 and deliberately not this store's**, and the validity
# is load-bearing. `decodeRecoveryPhrase` checks the wordlist and the checksum *before*
# `openDbKeyFromRecovery` is ever called, so a garbage phrase would be refused by the codec
# with a different message entirely and would prove nothing about the sidecar. This one is
# the standard all-zero-entropy vector (23 × `abandon` + `art`, verified against
# `packages/crypto/src/recovery-phrase.ts`): it decodes cleanly to 32 zero bytes, reaches
# the sidecar, and is rejected by its MAC. That the store's own recovery key is 32 zero
# bytes is not a case worth guarding against.
#
# No Argon2id on this path — the recovery key is raw key material, not a derived one — so
# this rejection is fast, which is the other reason it is worth asserting.
- tapOn:
    id: "recovery-secret"
- inputText: "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon art"
- runFlow:
    file: ../subflows/dismiss-keyboard.yaml
    env:
      ANCHOR: "Unlock your data"
- tapOn:
    id: "recovery-submit"
- extendedWaitUntil:
    visible: ".*That recovery phrase doesn't open this database.*"
    timeout: 60000

# --- and the password still opens it --------------------------------------------------------
# The "corrupts nothing" half: a rejected phrase left the password door exactly as it was.
# It also leaves the device unlocked rather than parked at a gate, so a standalone re-run of
# anything in the arc starts from a usable app.
- tapOn: "Use your password instead"
- assertVisible: ".*Enter your password to unlock it.*"
- tapOn:
    id: "recovery-secret"
- inputText: "correct-horse-battery-staple"
- runFlow:
    file: ../subflows/dismiss-keyboard.yaml
    env:
      ANCHOR: "Unlock your data"
- tapOn:
    id: "recovery-submit"
- extendedWaitUntil:
    visible: "Checking…"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "tab-search"
    timeout: 480000
- runFlow:
    file: ../subflows/tap-checked.yaml
    env:
      TARGET: "tab-search"
      EXPECT: "browse-tile-people"
- tapOn:
    id: "browse-tile-people"
- assertVisible: ".*Mary Bailey.*"
