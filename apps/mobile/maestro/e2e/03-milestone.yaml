# Flow 3 — Record a milestone, and prove it survived being written.
# plans/testing/crucial-flows.md → Flow 3. Runs at the `beta` rung.
#
# **What this proves that no lower tier can:** write → store → re-read → render in the
# production runtime against real storage, rather than an in-memory session. The catalog
# asks for a relaunch; this navigates away and back instead, which the catalog offers as
# the alternative. That is a deliberate limit worth naming: a route change re-runs the
# screen's `useFocusedData` and so re-reads the store, but it does **not** re-open the
# database file. Proving *that* is Flow 7b's job at `rc`, where the app is restarted
# through the boot gate.
#
# Inherits Flow 2's Mary.
#
# **The note is the assertion, not the date.** Kind and Month are `SelectField`s whose
# options iOS does not expose to the accessibility tree, so a driver cannot pick them;
# the year is the one date part it can type (`components/MilestoneFields.tsx`). Leaving
# Kind alone makes this a Birthday, the kind the picker opens on — the same trade
# `subflows/stage-birthday.yaml` documents.
appId: com.leapsake.app
---
# --- reach Mary ----------------------------------------------------------------------
# Flow 2 ends on Mary's page, which is pushed over the tab navigator and so has no tab bar
# of its own. Back to the navigator before reaching for a tab.
- openLink: "leapsake://"
- runFlow:
    file: ../subflows/tap-checked.yaml
    env:
      TARGET: "tab-search"
      EXPECT: "browse-tile-people"
# Wrapped, because a list row's accessibility text carries a trailing space and Maestro
# matches in full — see the note in `02-person-and-relationship.yaml`.
- tapOn:
    id: "browse-tile-people"
- tapOn: ".*Mary Bailey.*"

# --- add the milestone ---------------------------------------------------------------
# This "Add milestone" is the one in the person page's Milestones section, which opens a
# screen with its own Save — not the add form's inline row that `stage-birthday.yaml`
# drives. Same words, different screen: a saved person's parts are each their own small
# screen (increment 09's shape), and a milestone here is a write, not a draft.
- scrollUntilVisible:
    element:
      text: "Add milestone"
    direction: DOWN
- tapOn: "Add milestone"
- assertVisible: "Add milestone"

- tapOn:
    id: "milestone-year"
- inputText: "1815"
- tapOn:
    id: "milestone-note"
- inputText: "Met at the Analytical Engine talk"
# The Save lives in the native header, above the keyboard, so it is reachable without
# dismissing — but the assertion after it is not, and a keyboard left up is how a later
# `scrollUntilVisible` ends on a target it keeps finding and losing. "Year" is a plain
# `Text` label on this screen and never moves under the keyboard.
- runFlow:
    file: ../subflows/dismiss-keyboard.yaml
    env:
      ANCHOR: "Year"
- tapOn: "Save"

# --- it is on the timeline ------------------------------------------------------------
# **The note is not asserted here, because the page does not render it.** A milestone row
# is icon + label + date (`components/MilestonesSection.tsx`); the note reaches the screen
# only for an `other` milestone, where it *is* the label. The catalog says "the milestone
# and its note render on the person's timeline", which is not true of this build for a
# Birthday — so the note is read back below, out of the form that stores it, rather than
# asserted somewhere it was never going to appear.
- scrollUntilVisible:
    element:
      text: "Milestones"
    direction: DOWN
- assertVisible: ".*Birthday.*"
- assertVisible: ".*1815.*"

# --- and it is still there after leaving the screen and coming back --------------------
# The re-read. Leaving for Home and coming back re-runs the person screen's
# `useFocusedData`, so what renders the second time came out of the store rather than out
# of the form's component state.
#
# A deep link rather than a tab tap: this person's page is pushed over the tab navigator
# and has no tab bar of its own — the same trap as the top of this flow.
- openLink: "leapsake://"
- runFlow:
    file: ../subflows/tap-checked.yaml
    env:
      TARGET: "tab-search"
      EXPECT: "browse-tile-people"
- tapOn:
    id: "browse-tile-people"
- tapOn: ".*Mary Bailey.*"
- scrollUntilVisible:
    element:
      text: ".*Birthday.*"
    direction: DOWN
- assertVisible: ".*1815.*"

# --- and the note itself survived the write --------------------------------------------
# Read back out of the edit form, which loads it from the store. This is the assertion the
# timeline could not carry, and it is the stronger one anyway: it proves the value came
# back out of storage and into a field, not merely that a row exists.
#
# "Edit" appears three times on this page — Details, this milestone, and the relationship —
# so the anchor is the row's own heading rather than the bare word.
- tapOn:
    text: "Edit"
    below:
      text: ".*Birthday.*"
- assertVisible: ".*Met at the Analytical Engine talk.*"
