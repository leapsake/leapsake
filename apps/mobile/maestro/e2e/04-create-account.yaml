# Flow 4 — create an account, then open the store again by each door.
# plans/testing/crucial-flows.md → Flow 4.
#
# Act 1 converts Flow 2's plaintext store into an encrypted one in place and captures the
# phrase. Acts 2 and 3 lose the db-key and unlock by the password, then by the phrase.
# The phrase lives in `output`, which subflows share and a second `maestro test` would not.
#
# The out-of-band half is `custodyAuthenticated`, run by `scripts/test-e2e.mjs` after this
# flow goes green.
appId: com.leapsake.app
---
# =========================================================================================
# Act 1 — create the account, capture the phrase
# =========================================================================================
- runFlow:
    file: ../subflows/create-account.yaml
    env:
      USERNAME: "mary"
      PASSWORD: "correct-horse-battery-staple"

# The reveal replaces the form rather than sitting beneath it.
- assertNotVisible: "Protect your data"
- assertVisible: '24\. .*'
- assertNotVisible: '25\. .*'

# Reads the 24 numbered words (`N. word`) into `output.phrase`, space-separated.
# apps/mobile/maestro/README.md → *Capturing a secret the app shows once*.
- evalScript: ${output.n = 0}
- evalScript: ${output.phrase = ""}
- repeat:
    times: 24
    commands:
      - evalScript: ${output.n = output.n + 1}
      - copyTextFrom:
          text: "${output.n}\\. .*"
      - evalScript: '${output.phrase = output.phrase + " " + maestro.copiedText.replace(/^\d+\. /, "")}'
- evalScript: ${output.phrase = output.phrase.trim()}
- assertTrue: '${output.phrase.split(" ").length == 24 && output.phrase.indexOf(".") < 0}'

# "Done" stays disabled until the box is ticked, so a missed tick fails here.
- tapOn:
    id: "recovery-acknowledged"
- tapOn: "Done"

- assertVisible: "Your account is set up."
- assertNotVisible: "Save your recovery phrase"

# Mary, her milestone and her relationship, read out of the encrypted store.
- openLink: "leapsake://"
- runFlow:
    file: ../subflows/tap-checked.yaml
    env:
      TARGET: "tab-search"
      EXPECT: "browse-tile-people"
- tapOn:
    id: "browse-tile-people"
- assertVisible: ".*Mary Bailey.*"
- tapOn: ".*Mary Bailey.*"
- scrollUntilVisible:
    element:
      text: ".*Birthday.*"
    direction: DOWN
- assertVisible: ".*1815.*"
- assertVisible: ".*George Bailey.*"

# =========================================================================================
# Act 2 — the password door
# =========================================================================================
- runFlow:
    file: ../subflows/unlock-after-key-loss.yaml
    env:
      DOOR: "password"
      SECRET: "correct-horse-battery-staple"

# =========================================================================================
# Act 3 — the phrase door, after the password unlock has resealed it
# =========================================================================================
- runFlow:
    file: ../subflows/unlock-after-key-loss.yaml
    env:
      DOOR: "phrase"
      SECRET: "${output.phrase}"
