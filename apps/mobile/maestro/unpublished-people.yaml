# Recording somebody who is only a name on someone else's page.
#
# Type a name into a relationship's Name field that matches nobody, pick "Add
# … as a new person", and you get a person who exists as a fact about the
# subject and nothing more: on his page, absent from People & Pets and from
# every picker, findable only through him.
#
# Four claims, none of which a lower tier can make. The repo tests prove core
# does the right thing when asked; this proves the screens ask.
#
#   1. The create row appears for a name the list doesn't have, and saving it
#      puts that person on the subject's page.
#   2. People & Pets does not list them.
#   3. The relationship picker does not offer them — which is what keeps two
#      coworkers' wives called "Ruth" from being confused for one person.
#   4. Search finds them, and resolves to the person whose page they are on.
#
# Verify non-vacuous by sabotage: drop `listOnly` from `people-repo.ts` and
# cases 2 and 3 go red; drop the `attached` pass from `search-service.ts` and
# case 4 goes red on its "matched on" assertion.
#
# Like the other flows here it deliberately does not `launchApp`: a cold
# dev-client launch lands on the launcher, and these routes only exist once JS
# is loaded. Open the app to its home screen against a running Metro first.
#
#   maestro --udid <sim> test unpublished-people.yaml
#
# It leaves a person behind (dev data on a simulator), so the names carry a
# per-run tag — with fixed ones, run N leaves the Nth copy for the duplicate
# detector to score and render, and the flow gets slower and flakier the more
# it is used.
appId: com.leapsake.app
---
# A per-run stamp on every name it creates. Names are also
# chosen not to be substrings of each other or of the seeded simulator contacts,
# since every assertion below is about one name being present while another is
# absent.
- evalScript: ${output.run = Date.now() % 1000000}

# ── 1. A subject to hang her off ────────────────────────────────────────────
- runFlow:
    file: subflows/add-person.yaml
    env:
      FIRST: "Ernie${output.run}"
      LAST: "Bishop${output.run}"
- runFlow:
    file: subflows/save-record.yaml

# ── 2. Name somebody the list doesn't have ──────────────────────────────────
# A relationship is added from the Relationships section on the record's own
# page, which pushes a screen holding one relationship and its own Save. The
# scroll is UP because `save-record.yaml` leaves the page at its Gifts section,
# which sits below this one.
- scrollUntilVisible:
    element:
      text: "Add relationship"
    direction: UP
- tapOn: "Add relationship"
- assertVisible:
    id: "relationship-other-name"
- tapOn:
    id: "relationship-other-name"
- inputText: "Jenqx${output.run}"

# The offer only exists because nothing matched: assert the create row rather
# than tapping it blind, or a stray match would silently pick a real person.
- assertVisible: "Add “Jenqx${output.run}” as a new person"
- tapOn: "Add “Jenqx${output.run}” as a new person"

# Role is a collapsed row over a sheet, not an inline field: forty-one roles
# don't fit the third of a line it shares with Name. So the row opens the sheet
# and the sheet's own filter is what gets typed into.
- tapOn:
    id: "relationship-other-role"
- tapOn:
    id: "relationship-other-role-filter"
# Deliberately a *partial* query. Typing the whole word puts "Wife" in the filter
# as well as on the option beneath it, and `tapOn` takes the first match — which
# is the filter, leaving the role unset and Save disabled a step later.
- inputText: "Wif"
- tapOn: "Wife"
# No keyboard to dismiss: picking a role closes the sheet, and the sheet is what
# the keyboard belonged to. Save is in the native header either way.
#
# Save writes this one relationship — and, because nothing matched her name, the
# person on the other end of it — then returns to his page.
- tapOn: "Save"

# She is on his page, as the one relationship that is her whole existence.
- scrollUntilVisible:
    element:
      text: "Jenqx${output.run}"
    direction: DOWN
- assertVisible: "Jenqx${output.run}"

# ── 3. …but nowhere else ────────────────────────────────────────────────────
- openLink: "leapsake://people"
- assertVisible: ".*Ernie${output.run} Bishop${output.run}.*"
- assertNotVisible: "Jenqx${output.run}"

# Not offered as the other end of a relationship either. Reuses the subject's
# own add-relationship screen: typing her name there must turn up only the
# offer to create *another* person by that name, never the one that exists.
- tapOn: ".*Ernie${output.run} Bishop${output.run}.*"
- scrollUntilVisible:
    element:
      text: "Add relationship"
    direction: DOWN
- tapOn: "Add relationship"
- tapOn:
    id: "relationship-other-name"
# A *prefix* of her name, for the same reason the role query is one: the field
# echoes what is typed, so searching her full name would find that echo and prove
# nothing. Typing a prefix means the only way her full name can appear is as a
# row the picker offered.
- inputText: "Jenqx"
- assertVisible: "Add “Jenqx” as a new person"
- assertNotVisible: "Jenqx${output.run}"
# Back out without saving. The screen has no Cancel because "‹ Back" is one:
# nothing typed here was written, which is what makes leaving safe.
- back

# ── 4. Findable through him ─────────────────────────────────────────────────
- openLink: "leapsake://search"
- tapOn:
    id: "search-field"
- inputText: "Jenqx${output.run}"
- assertVisible: ".*Ernie${output.run} Bishop${output.run}.*"
- assertVisible: ".*matched on.*Jenqx${output.run}.*"
