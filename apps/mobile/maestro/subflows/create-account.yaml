# Create an account: username + password, submitted, through to the one-time reveal.
#
# **Extracted from `../e2e/04-create-account.yaml` so that Flow 7b can use it too**, and
# for one reason beyond tidiness: most of what is below is the iOS "Use Strong Password?"
# workaround, and that is a mitigation for a system behaviour a runtime update can re-arm
# at any time. Two copies of it would drift, and the copy that drifted would be the one
# that was not being run that week.
#
# **This ends the moment the reveal is on screen, and asserts nothing about it.** The two
# callers want different things from that moment — `04` asserts the phrase renders as 24
# words and dismisses it, `07b` copies the words out — and a subflow that acknowledged the
# phrase would be useless to the flow that needs to read it. So the boundary is "the
# reveal is up", which is the last thing both callers agree on.
#
#   USERNAME, PASSWORD — the account to create. PASSWORD must be ≥12 characters or the
#   form refuses itself and the guard below fires.
#
# Preconditions: an Unauthenticated app, on any screen (this deep-links to Settings).
appId: com.leapsake.app
---
- openLink: "leapsake://settings"
- assertVisible: "Protect your data"

# Both password fields are `secureTextEntry` with identical (empty) accessibility text, so
# all three are reached by id — the ids exist for this flow, and the comment beside them in
# `app/settings.tsx` says so.
#
# iOS draws no dots in a `newPassword` field under automation, so do not judge these by
# looking: the evidence they landed is the submit below getting past validation, which
# refuses a password under 12 characters or a mismatched confirmation. That evidence is now
# an assertion of its own rather than an inference — see "the form was accepted" below.
- tapOn:
    id: "account-username"
- inputText: "${USERNAME}"
# --- the password, typed twice on purpose -------------------------------------------------
# **iOS eats the first attempt, and nothing in the app can see it happen.** On the first
# entry into a `newPassword` field, iOS raises its own "Use Strong Password?" AutoFill card
# over the form. It is drawn by a system process, not by the app, so it is absent from the
# hierarchy Maestro reads: `assertVisible`/`runFlow: when:` cannot see it, and there is no
# selector to dismiss it by. What it does see is the keyboard, and the characters after the
# first few land in the card instead of the field — leaving the password short, the form
# refusing itself with "Password must be at least 12 characters", and the calling flow
# reporting a red that has nothing to do with what it was testing.
#
# **It is the machine-local toggle coming back that puts it there.** `../README.md` says to
# turn Settings -> AutoFill & Passwords off once per simulator, and that had been done here.
# Installing the iOS 26.5 (23F77) runtime on 2026-09-08 put it back, and `04` — whose form
# code had not changed since it was last green on 2026-08-28 — went red the same day.
# This defeats the card, but **not** the persistent cover view a freshly erased simulator
# draws — that one swallows the second attempt too. `../ios-autofill.yaml` is the preflight
# that catches the toggle being on before the catalog spends a suite on it.
#
# **Tapping any other field dismisses the card, and iOS does not offer it twice**, so the
# fix is to type the password, tap away, and type it again into an erased field. The second
# attempt lands in full. Neither splitting `inputText` into chunks nor pasting from the
# clipboard avoids the first one — both were measured, and both lose the same characters.
#
# The extra taps cost about a second and are inert wherever the card does not appear (older
# iOS, Android), which is why this is written unconditionally rather than guarded: a
# condition would have to key on something Maestro can see, and that is exactly what iOS
# does not give it here.
- tapOn:
    id: "account-password"
- inputText: "${PASSWORD}"
- tapOn:
    id: "account-username"
- tapOn:
    id: "account-password"
- eraseText
- inputText: "${PASSWORD}"
- tapOn:
    id: "account-confirm-password"
- inputText: "${PASSWORD}"

# The submit sits under the keyboard on a phone-sized screen. "Username" is this screen's
# first field label, a plain `Text` well above the keyboard.
- runFlow:
    file: dismiss-keyboard.yaml
    env:
      ANCHOR: "Username"
- tapOn:
    id: "account-submit"

# --- the form was accepted ----------------------------------------------------------------
# **Fifteen seconds of insurance against eight minutes of the wrong question.** Every way
# `onSubmit` refuses the form — an empty username, a short password, a mismatch — leaves the
# button reading "Protect my data" with an error beside it, and the app doing nothing at all.
# Without this the caller would then spend its whole conversion budget waiting for a reveal
# that was never coming, and report the *reveal* as the failure. That is not hypothetical:
# on 2026-09-05, with the host cores saturated, `inputText` dropped characters into the two
# password fields, the form said "The passwords don't match", and the red that came three
# minutes later named the wrong thing entirely.
#
# Waited for rather than asserted because the tap returns as soon as the view hierarchy
# changes, which on a loaded machine is *before* React has committed the button's re-render.
# A bare `assertNotVisible` here reads the pre-tap label and fails on a healthy app.
- extendedWaitUntil:
    notVisible: "Protect my data"
    timeout: 15000

# --- the one-time reveal ----------------------------------------------------------------
# Waited for rather than asserted: the button reads "Encrypting your data…" while the store
# is converted, and how long that takes is a property of the machine, not of the harness.
#
# **Eight minutes, and the reason is that this step's cost is not reliably its own.** On the
# emulator this harness provisions (`EMULATOR_SIZE` — 6 cores, 8GB) the conversion measures
# 48-85s across a dozen green Android runs, and 52s on the iOS simulator on every run ever
# recorded; a 19MiB memory-hard Argon2id pass on unJITted Hermes is simply what it costs.
# But the same commit, on the same emulator, has also run past three minutes with the app in
# perfect health — the beta release gate on 2026-09-05, whose screenshot showed the button
# still reading "Encrypting your data…", `logcat` from the app's own pid holding nothing but
# routine GC, and `top -H` showing `mqt_v_js` pegged at 100% with `pgmajfault` flat beside
# it. That same commit converted in 48.3s and 48.8s minutes later, and in 108.8s with all
# twelve host cores deliberately saturated by `yes`.
#
# **The number is 480000 because a 294.5s conversion has been watched all the way to the
# reveal.** That is the one measurement that settles it: same commit, same emulator, idle
# host, an hour into the emulator's uptime — six times the median, finishing correctly, and
# a red under any budget this step has ever carried. It is the degraded mode the memory
# section of `../README.md` first measured at "four to seven minutes", and it is reachable
# with the emulator sized exactly as this harness sizes it. What the budget has to cover,
# then, is not the conversion but the machine the conversion is sharing — and the tier this
# runs in is the last one of a suite that has just spent fifteen minutes compiling,
# type-checking and driving two devices.
#
# So the budget is set past the worst degradation ever measured rather than a little above
# the median, and the guard above is what keeps that from being expensive: the failures that
# come from the app rather than from the machine now cost fifteen seconds, not this.
#
# ⚠️ **Do not turn this into a `repeat` of shorter waits** to get a tighter grip on the
# ceiling. It reads well and does not work: inside a `repeat`, Maestro honours
# `extendedWaitUntil`'s timeout on the *first* iteration only — measured 2026-09-05, a
# 60s × 8 loop that spent 59s on its first tick and 0.3s on each of the next seven, so the
# flow went red at 75s believing it had waited eight minutes.
- extendedWaitUntil:
    visible: "Save your recovery phrase"
    timeout: 480000
