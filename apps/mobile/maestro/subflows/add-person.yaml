# Open a fresh add screen and name the person. FIRST and LAST are required — the
# Save action stays disabled until both are set.
#
# Both fields are reached by `id`, not by position: an empty TextInput carries no
# accessibility text, and the add form is long enough that the keyboard reflows it
# as it opens, so a positional selector lands on the wrong field or on nothing.
#
# The `assertVisible` is a settle: the first `inputText` after `openLink` is lost
# if it arrives before the screen has mounted something to focus.
appId: com.leapsake.app
---
- openLink: "leapsake://add"
- assertVisible:
    id: "person-first-name"
# **Each field is typed, then read back.** On a hosted runner one job saved a person called
# "M Bailey": the first keystroke landed and the rest went missing. `eraseText` first, so a
# retry types into an empty field rather than appending to what did arrive.
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "person-first-name"
      - eraseText
      - inputText: "${FIRST}"
      - assertVisible:
          id: "person-first-name"
          text: "${FIRST}"
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "person-last-name"
      - eraseText
      - inputText: "${LAST}"
      - assertVisible:
          id: "person-last-name"
          text: "${LAST}"
- runFlow:
    file: dismiss-keyboard.yaml
    env:
      ANCHOR: "Milestones"
