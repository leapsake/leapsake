# Put the keyboard away, and prove it went.
#
# This exists because Maestro reads visibility off the view hierarchy, which does
# **not** model the keyboard as occluding anything. An element behind it still
# counts as visible, so `scrollUntilVisible` stops as soon as it has scrolled that
# far and the tap that follows lands on a key instead — which surfaces as a step
# that "COMPLETED" while doing nothing, several steps before the failure.
#
# Neither dismissal is reliable alone:
#
#   - `pressKey: Enter` does nothing to a plain single-line `TextInput`. RN wires
#     no `onSubmitEditing` here, and iOS does not blur on return by itself.
#   - `hideKeyboard` taps through into whatever sits under it (the Gender field,
#     in practice) and opens *that*.
#
# What does work is an unhandled tap: every form's ScrollView sets
# `keyboardShouldPersistTaps="handled"`, so a tap on a plain `Text` — one that no
# touchable claims — dismisses.
#
# **ANCHOR is that text**, and it is the caller's to name because the forms no
# longer share one. "Milestones" serves the add screen, where that section
# heading is always present and never moves below the keyboard; a small screen
# off a record's page has no sections, so it names one of its field labels
# instead. Whatever is picked must be a plain `Text` — tapping a `Pressable`
# would be handled, and so would not dismiss.
#
# The closing assert is the point. Without it a failed dismissal goes unnoticed
# until something far downstream taps a key, and `scrollUntilVisible` can spin on
# a target it keeps finding and losing rather than failing outright.
#
# **Each platform needs its own probe, because each keyboard is a different
# app.** `Return` is the iOS keyboard's own return key — an Apple-owned id. On
# Android the keyboard is Gboard, whose nodes all carry its package in their
# `resource-id`, so any of them means it is up. This subflow once probed for
# `Return` alone, which on Android is never there: the fallback tap never ran and
# the assert passed with the keyboard still open. Nothing noticed until the door
# flow's first Android run (2026-09-10): on the phrase door, `Enter` put a newline in the
# `multiline` field, Gboard stayed over **Unlock**, and the tap aimed at the button
# opened Gboard's Settings instead.
#
# Enter is iOS-only: on Android a key event leaves touch mode, and its key-up
# clicks whichever view takes focus when the field blurs.
appId: com.leapsake.app
---
- runFlow:
    when:
      platform: iOS
    commands:
      - pressKey: Enter
- runFlow:
    when:
      visible:
        id: "Return"
    commands:
      - tapOn: "${ANCHOR}"
- runFlow:
    when:
      platform: Android
      visible:
        id: "com\\.google\\.android\\.inputmethod\\.latin:id/.*"
    commands:
      - tapOn: "${ANCHOR}"
- assertNotVisible:
    id: "Return"
- assertNotVisible:
    id: "com\\.google\\.android\\.inputmethod\\.latin:id/.*"
