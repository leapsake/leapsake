# `type-checked.yaml` for a field whose value is hidden: type `VALUE` into `FIELD`, then check
# the field is **not empty** — the hierarchy renders a secret as dots, so that is all it can say.
#
# Worth having anyway, because empty is the failure that happens: a dropped `inputText` leaves
# `submit()` returning early with the button still reading "Unlock", and the flow then spends
# its whole Argon2id budget waiting for a screen that was never coming (hosted runner, iOS,
# 2026-09-20 — the guard caught it in 15s, one flow later than it needed to).
appId: com.leapsake.app
---
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "${FIELD}"
      - eraseText
      - inputText: "${VALUE}"
      - assertVisible:
          id: "${FIELD}"
          text: "•+"
