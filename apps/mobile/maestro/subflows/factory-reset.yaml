# Put the app back to a genuine first-run state: no people, no pets, no reminders, no
# account, no keys — and then **relaunch**, because a reset alone does not get there.
#
# ## Why the app's own factory reset, and not the harness's obvious tools
#
# Maestro's `clearState` and `simctl uninstall` wipe more than the app's data: they take
# the expo-dev-menu preferences the runner just settled and, on iOS, the dev-launcher's
# memory of which dev server to load. The next flow would open the launcher instead of
# Leapsake, and the failure reads as "the app never came up" rather than "the harness
# erased its own setup". `sync.factoryReset()` erases exactly the app's own state — store,
# doors, account roster, every keystore secret — and rebuilds the provider down the
# *Unauthenticated* path (`lib/core-context.tsx`).
#
# **The harness wipes too, and this is still not redundant.** `scripts/lib/
# mobile-harness.mjs` → `wipe` clears the app's data from outside before the suite starts,
# because a run whose app is wedged cannot be driven to this screen at all, and because
# the arc must not inherit the previous run's account. That is the *precondition*. This
# subflow is the *coverage*: it is the only thing in the suite that drives the erase a
# user would perform, and Flow 1 is where a build that quietly stopped erasing has to show
# up. Running both means the erase happens on a store whose contents are known.
#
# ## Why it relaunches, which is the part that is not obvious
#
# **The state a factory reset leaves behind is racy, and a first run's is not.** Measured
# on the simulator, 2026-08-28: reset twice in a row, Home came back once reading "No
# reminders yet." and once already showing the `add-first-person` nudge. The reminders
# engine reconciles asynchronously and the in-place provider rebuild does not wait for it,
# so whether the nudge is on screen right after a reset is a timing question. A relaunch
# settles it — the bootstrap reconciles before Home renders — which is also what the
# catalog's "launch the built app; wait for boot to settle" asks for.
#
# So **nothing here asserts on the post-reset screen**; the assertion is made after the
# relaunch, where it is deterministic.
#
# ## Two traps this encodes, both hit on the first run of this flow
#
#   1. **Never end on `assertNotVisible: "Erasing…"`.** The button reads "Erase
#      everything" until the tap takes effect, so that assertion passes just as happily
#      when nothing happened. Both exits below are positive assertions instead.
#   2. **`app/data.tsx` is a root-level route pushed over the tab navigator** — its header
#      is a Back control, and there is no `tab-home` to tap from it.
#
# ## One act, two names — and this is what makes the arc re-runnable
#
# The reset is only called "Factory reset" while the device is Unauthenticated. With an
# account it is **Forget account**, which erases the same things under the name that fits
# (`app/data.tsx`). Flow 4 creates an account, so before the harness wipe existed the
# *next* run of the arc arrived here with only the second name on offer — a subflow that
# knew only the first would leave the suite good for exactly one run.
#
# The harness wipe now settles which one it is: the device always arrives Unauthenticated,
# so it is always "Factory reset". The Forget branch stays because it costs one guarded
# block and it is what the flow falls back on if it is ever run by hand against a device
# that has an account. They differ in their confirm word (ERASE vs DELETE) and their
# button, and in nothing else that matters here.
appId: com.leapsake.app
---
- openLink: "leapsake://data"

# Open whichever confirmation this device offers. Every step here is conditional, because
# `openLink` does not remount a route that is already mounted: a previous run that died
# mid-confirm leaves this screen already armed and the opening button gone. The ellipsis
# separates each button from the section heading above it, which is the plain word and is
# not tappable.
- runFlow:
    when:
      visible: "Factory reset…"
    commands:
      - tapOn: "Factory reset…"
      # **Wait for the field, exactly as the Forget branch below does.** Without this the
      # `when: visible: factory-reset-confirm` gate underneath is evaluated a few
      # milliseconds after the tap, before the confirmation has rendered — so it reads
      # false, the fill-and-fire block is SKIPPED, and **the flow erases nothing while
      # every step still reports COMPLETED**. Seen on Android 2026-08-31: `Tap on
      # "Factory reset…" COMPLETED` followed immediately by `Run flow when id:
      # factory-reset-confirm is visible... SKIPPED`, and Flow 1 then asserting a first
      # run against the previous arc's store. It is the same silent class as the keyboard
      # trap below, and worse, because it can leave the whole suite green on stale state.
      - extendedWaitUntil:
          visible:
            id: "factory-reset-confirm"
          timeout: 20000
      # The export offer belongs to this moment, not only to the top of the
      # screen. Asserted, never tapped: a share sheet opened inside the teardown
      # would need dismissing, and a teardown that stalls leaves the next flow
      # asserting against the previous arc's store — the same silent class as
      # the two traps above.
      - assertVisible: "Export my data first…"
- runFlow:
    when:
      visible: "Forget account…"
    commands:
      - tapOn: "Forget account…"
      # Entering this confirmation asks the relay whether it keeps a durable copy, so the
      # fields arrive a beat after the tap. Waiting for the field is the difference
      # between branching on custody and branching on a render race.
      - extendedWaitUntil:
          visible:
            id: "forget-account-confirm"
          timeout: 20000
      # As in the factory-reset branch above: asserted, never tapped. This is
      # the branch that has never actually run, because every green arc ends
      # Unauthenticated — see `plans/export.md` → *Still owed: the device tier*.
      - assertVisible: "Export my data first…"

# Fill and fire whichever is now open. `eraseText` first, because a field still holding the
# word from a dead run would otherwise become ERASEERASE, which arms nothing — and the flow
# would fail on a disabled button rather than on anything real.
- runFlow:
    when:
      visible:
        id: "factory-reset-confirm"
    commands:
      - tapOn:
          id: "factory-reset-confirm"
      - eraseText
      - inputText: "ERASE"
      - runFlow:
          file: dismiss-keyboard.yaml
          env:
            ANCHOR: "Factory reset"
      - tapOn: "Erase everything"
- runFlow:
    when:
      visible:
        id: "forget-account-confirm"
    commands:
      - tapOn:
          id: "forget-account-confirm"
      - eraseText
      - inputText: "DELETE"
      # The title, not the button: "Delete all data on this device" is a plain `Text` at
      # the head of the section, while "Delete all data" is what we are about to press.
      - runFlow:
          file: dismiss-keyboard.yaml
          env:
            ANCHOR: "Delete all data on this device"
      - tapOn: "Delete all data"

# **Both branches put the keyboard away before reaching for their button.** Each sits
# within a few pixels of the keyboard's top edge on an iPhone 16 Pro, and Maestro does not
# model the keyboard as occluding anything — so the tap lands on the keyboard, reports
# COMPLETED, and erases nothing. This flow passed and failed alternately for two runs on
# exactly that: the erase only happened when the keyboard happened to be down. It is the
# hazard `dismiss-keyboard.yaml` was written for, and a silent one matters more here than
# anywhere else, because the failure surfaces later — as a first-run assertion failing
# against a store still full of the previous arc's people.

# Off the Data screen and wait for the rebuilt app to be interactive again before killing
# it. This is a settle, not an assertion: the reset deletes the store, the doors, the
# roster and every keystore secret, and stopping the app in the middle of that would leave
# a half-erased device that the next launch has to make sense of.
- openLink: "leapsake://"
# 60s, not 30: this waits out the *provider rebuild* the reset kicks off — a new store
# opened, the schema created, the reminders engine reconciled — not a screen transition.
# On a loaded machine 30s was not enough for it, and the flow then died here having done
# everything right (Android, 2026-08-31).
- extendedWaitUntil:
    visible:
      id: "tab-search"
    timeout: 60000

# The relaunch, and the one assertion. It is non-vacuous in exactly the way the vacuous
# `assertNotVisible` above was not: `add-first-person` applies only while the store holds
# no entities, and retirement is a permanent tombstone — so an erase that silently did
# nothing leaves the previous arc's people in place, the step unmet, and this red.
- stopApp
- launchApp
# **A cold dev-client launch does not always land on the app**, and the two platforms
# differ on it — which is the one place this arc had to learn Android's shape. On iOS the
# dev client reconnects to its remembered dev server on its own. On Android it shows the
# **expo-dev-launcher** instead: a list of development servers with the app nowhere on
# screen, so the wait below spent its full 60s and the flow died on `tab-search is not
# visible` while the device was perfectly healthy. It is the same class of failure as the
# dev-menu overlay — a screen in front of the app that does not look like one from the
# log.
#
# Handled the way `../ios-prepare.yaml` handles the same family on iOS: a guarded tap that
# simply does not fire when the control is absent, so **the file stays byte-identical
# across platforms**. The entry is matched by URL rather than by "Leapsake", which names
# both the launcher's own header and every row in its list. `localhost:8081` is there
# because the harness loads the bundle over `adb reverse` from localhost; the animation
# wait is what keeps the check from running before the launcher has drawn.
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible: ".*localhost:8081.*"
    commands:
      - tapOn: ".*localhost:8081.*"
# 120s, matching the harness's own `HOME_TIMEOUT_MS` for the same act: this is a **cold**
# dev-client launch — a fresh process fetching the whole JS bundle from Metro and booting
# it — which is the slowest thing in the suite and has nothing to do with how fast the app
# is. At 60s it went red on an emulator that reached the tab bar seconds later; the budget
# was measuring the machine, not the build.
- extendedWaitUntil:
    visible:
      id: "tab-search"
    timeout: 120000
#
# **Waited for, not asserted outright.** The reconcile is asynchronous and a visible tab
# bar is not a signal that it has run: asserting immediately after the relaunch went red
# on one run and green on the next. The wait is what makes this deterministic, and it
# stays non-vacuous — a nudge that never arrives still fails, it is simply given time to.
- extendedWaitUntil:
    visible: ".*Add your first person to get started.*"
    timeout: 30000
