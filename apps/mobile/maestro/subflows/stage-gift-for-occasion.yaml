# Stage a gift named TITLE, carrying one giving row whose occasion is OCCASION —
# the only occasion the form offers, since the caller has staged exactly one
# milestone or holiday.
#
# "Add gift" appends an **open row** to the Gifts section, which this then types
# into; there is nothing to submit afterwards, the entity form's own Save being
# what writes it. See the note at the foot of this file.
#
# The occasion picker is the one control here that is **not** the same on both
# platforms — a modal wheel on iOS, a list dialog on Android — so this subflow
# branches on it. See the comment at that step; everything else is portable.
#
# Every target is scrolled to first. Neither `tapOn` nor `assertVisible` scrolls
# on its own, and the add form is several screens long once a section expands —
# so a step that happens to be on screen today breaks the day a section above it
# grows a row.
#
# The keyboard goes down before any of that scrolling — see `dismiss-keyboard.yaml`
# for why that is its own verified step. A pet is what caught it: its shorter form
# leaves these gift fields sitting right under the keyboard.
appId: com.leapsake.app
---
- scrollUntilVisible:
    element:
      text: "Add gift"
    direction: DOWN
- tapOn: "Add gift"
# The form's first control, and the reason there is a giving row to fill in at
# all: its two segments are Idea (the default, one target occasion) and Already
# gave it (dated rows). This used to be "+ Add a date" *below* the title, because
# adding a date is what used to turn a suggestion into a giving; the form now
# asks outright, so the answer is given before anything is typed.
- scrollUntilVisible:
    element:
      text: "Already gave it"
    direction: DOWN
- tapOn: "Already gave it"
- scrollUntilVisible:
    element:
      id: "gift-title"
    direction: DOWN
- tapOn:
    id: "gift-title"
- inputText: "${TITLE}"
- runFlow:
    file: dismiss-keyboard.yaml
- scrollUntilVisible:
    element:
      id: "gift-occasion"
    direction: DOWN
- tapOn:
    id: "gift-occasion"
# A `SelectField` is a **different native control on each platform**, and this is the
# one place in the catalog where that surfaces. iOS presents a modal wheel whose
# options are not addressable — the accessibility tree exposes only the picker's
# current value — so the choice has to be made by swiping and then proving where it
# landed. Android presents a plain list dialog whose options *are* addressable, so
# the same choice is one tap and there is no confirm button at all.
#
# The branch keys on **"Done"**, which is the wheel's confirm button and the thing
# that actually differs: no Done, no wheel. Keying on the presence of the option
# text instead would be subtly wrong on iOS, where the screen *behind* a modal stays
# in the accessibility tree and the staged milestone row is sitting right there.
#
# **The order of these two blocks is load-bearing, and the wrong order still passes
# on Android.** Maestro re-evaluates each `when:` when it reaches it — these are two
# independent conditionals, not an if/else — so with the wheel branch first, iOS runs
# it, taps Done, and *then* satisfies `notVisible: "Done"` and runs the list branch
# too, failing on an option that is no longer on screen. The list branch goes first
# because it is the one that cannot manufacture the other's condition: tapping an
# option never produces a "Done".
- runFlow:
    when:
      notVisible: "Done"
    commands:
      - tapOn: "${OCCASION}"
      # On the closed field, which the dialog dismissing leaves in place. This is
      # this branch's counterpart to the wheel's in-flight assert below: without it
      # a tap that dismissed the dialog without selecting would pass silently.
      - assertVisible: "${OCCASION}"
- runFlow:
    when:
      visible: "Done"
    commands:
      # One notch up the wheel: "— none —" -> the single staged occasion. Kept short
      # and slow; a long fast swipe reads as a shake and opens the Expo dev menu.
      - swipe:
          start: "50%, 87%"
          end: "50%, 83%"
      # Inside the open wheel, on the value the swipe landed on. Without this a swipe
      # that moved nowhere (or two notches) would pass silently and the case would go
      # green having picked "— none —".
      - assertVisible: "${OCCASION}"
      - tapOn: "Done"
# No commit step: "Add gift" appended a row and this filled it in. It used to
# open a sub-form with its own `Cancel  Add`, whose Add moved a frozen payload
# into the list as a summary line ("1 date") — which is what this asserted on. The
# row is the draft now, so what proves the same thing is the picker still reading
# back the occasion that was chosen, which both platform branches above assert
# before leaving the field.
