# Add a birthday milestone, dated by its YEAR, from the add form.
#
# The form's Milestones ➕ opens the same milestone screen a saved person's does,
# once the record has a name; it saves and comes straight back. The kind is left
# alone, which makes this a Birthday, the first kind either bearer type offers.
appId: com.leapsake.app
---
- scrollUntilVisible:
    element:
      text: "Add milestone"
    direction: DOWN
- tapOn: "Add milestone"
- tapOn:
    id: "milestone-year"
- inputText: "${YEAR}"
- tapOn: "Save"
- scrollUntilVisible:
    element:
      text: ".*Birthday.*"
    direction: DOWN
