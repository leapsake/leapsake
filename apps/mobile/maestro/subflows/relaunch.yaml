# Force-quit the app and bring it back up — and nothing else.
#
# **Stops short of waiting for anything on purpose.** A relaunch is followed by a
# wait for whatever the caller expects to see, and the callers do not agree:
# `factory-reset.yaml` waits for `tab-search`, `unlock-after-key-loss.yaml`
# waits for `recovery-gate`. Baking either one in here would make the subflow lie
# to the other, so this ends the moment the app is launched and the caller says
# what "up" means.
#
# **A cold dev-client launch does not always land on the app**, and the two
# platforms differ on it — which is the one place the E2E arc had to learn
# Android's shape. On iOS the dev client reconnects to its remembered dev server
# on its own. On Android it shows the **expo-dev-launcher** instead: a list of
# development servers with the app nowhere on screen, so the caller's wait spends
# its full budget and the flow dies on "not visible" while the device is
# perfectly healthy. It is the same class of failure as the dev-menu overlay — a
# screen in front of the app that does not look like one from the log.
#
# Handled the way `../ios-prepare.yaml` handles the same family on iOS: a guarded
# tap that simply does not fire when the control is absent, so **this file stays
# byte-identical across platforms**. The entry is matched by URL rather than by
# "Leapsake", which names both the launcher's own header and every row in its
# list. `localhost:8081` is there because the harness loads the bundle over `adb
# reverse` from localhost; the animation wait is what keeps the check from running
# before the launcher has drawn.
appId: com.leapsake.app
---
- runFlow: no-console-error.yaml
- stopApp
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
# `optional`: on iOS the launcher can reconnect on its own between the check and the tap,
# and then there is nothing left to tap. Seen on a hosted runner, 2026-09-19.
- runFlow:
    when:
      visible: ".*localhost:8081.*"
    commands:
      - tapOn:
          text: ".*localhost:8081.*"
          optional: true
