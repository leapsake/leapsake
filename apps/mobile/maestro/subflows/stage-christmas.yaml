# Stage Christmas as an observed holiday.
#
# The section browses the catalog: opening it lists every holiday this bearer
# could observe, with a filter above them. The filter is still used here — the
# list is long, and scrolling a hundred rows to reach December is slower and
# flakier than typing four letters — and the results render *under* the keyboard,
# so the keyboard is dropped before reaching for the match, or the tap lands on a
# key.
#
# The filter is addressed by `testID`: its label is "Search", which is also a tab.
appId: com.leapsake.app
---
- scrollUntilVisible:
    element:
      text: "Add holiday"
    direction: DOWN
- tapOn: "Add holiday"
- tapOn:
    id: "holiday-search"
- inputText: "Christ"
- runFlow:
    file: dismiss-keyboard.yaml
    env:
      ANCHOR: "Milestones"
- scrollUntilVisible:
    element:
      text: "Add Christmas"
    direction: DOWN
- tapOn: "Add Christmas"
- tapOn: "Done"
- assertVisible: "Christmas"
