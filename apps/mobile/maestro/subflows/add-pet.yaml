# Open a fresh add screen, switch it to a pet, and name the pet. NAME is required —
# the Save action stays disabled until it is set. A pet needs only the one name,
# where a person needs a first *and* a last.
#
# See `add-person.yaml` for why the field is reached by `id` and why the keyboard
# is dropped by tapping a label.
appId: com.leapsake.app
---
- openLink: "leapsake://add"
- assertVisible:
    id: "person-first-name"
- tapOn:
    id: "add-switch-type"
- assertVisible:
    id: "pet-name"
- tapOn:
    id: "pet-name"
- inputText: "${NAME}"
- runFlow:
    file: dismiss-keyboard.yaml
    env:
      ANCHOR: "Milestones"
