# Staged gift occasions on the add person/pet screen.
#
# The add screen stages a whole record before any of it exists, and a gift's
# occasion points at a milestone or holiday **by id**. A staged holiday's id is
# real (it comes from the catalog); a staged milestone has no id until it is
# written. So the screen offers staged milestones under a client-minted key and
# remaps them as it writes (`resolveStagedOccasion`), and clears any occasion
# whose milestone/holiday is removed before saving (`pruneGiftOccasions`).
#
# Five cases, and each one fails differently if that machinery breaks. Verified
# by sabotage — the line each case actually goes red on is noted:
#
#   1. milestone kept    -> the occasion resolves to the real milestone.
#      Break the remap and the id stays a staged key, `resolveOccasionLabel`
#      finds no such milestone, and the row loses its "— Birthday".
#      (red on: the saved ".*Given.*Birthday.*")
#   2. milestone removed -> the occasion is dropped, not written dangling.
#      Break the *prune* and this goes red on the **staged** summary, before
#      anything is written: the row still claims "1 date". Its saved outcome
#      stays correct even so, because the removed milestone's key never enters
#      the id map and the write-time resolver drops it anyway.
#      (red on: the pre-save "Suggestion")
#   3. holiday kept      -> passes through untouched; no remap involved.
#   4. holiday removed   -> **the only case where a missing prune corrupts what
#      is saved.** A holiday id stays resolvable forever, so the write-time
#      resolver has no reason to drop it; without the prune the gift is written
#      "for Christmas" against someone who no longer observes it.
#      (red on: the saved "Suggested")
#   5. the same as case 1, but for a **pet**. The bearer type takes two separate
#      routes out of the entity toggle — into the milestone write, and into the
#      gift's recipient party — and a person-shaped assumption on either is
#      invisible to cases 1-4, where the type happens to be "person" anyway.
#      Both were checked by sabotage, and they land on different assertions:
#        - recipient party forced to "person": the gift is written against a
#          person id that is really the pet's, so the pet's Gifts section is
#          empty. (red on: the saved ".*Given.*Birthday.*")
#        - milestone bearer forced to "person": the gift row still reads
#          "Given — Birthday", because the occasion label resolves the milestone
#          **by id alone** and does not care what it hangs off. Only the pet's own
#          Milestones section can tell. (red on: the saved "🎂 Birthday")
#      That second one passed a full green run before its assertion existed —
#      which is why the milestone row is asserted separately from the gift row.
#
# Like `driver-selftest.yaml` this deliberately does not `launchApp`: a cold
# dev-client launch lands on the launcher, and these routes only exist once JS is
# loaded. Open the app to its home screen against a running Metro first.
#
#   maestro --udid <sim> test staged-gift-occasions.yaml
#
# It leaves four people and a pet behind (dev data on a simulator), so every run
# stamps them with a per-run tag. That is not tidiness: with fixed names, run N
# creates the Nth copy of each, every one of which the post-save duplicate
# detector then has to score and render as a pair — the review screen grows a row
# per previous run, and the suite gets slower and flakier the more it is used. A
# unique tag means the detector finds nothing and each run is genuinely
# independent of the last. The "Not now" fallback in `save-record.yaml` stays as a
# safety net, but nothing here relies on it.
#
# The wheel: a `SelectField`'s options are not addressable on iOS — the
# accessibility tree exposes only the picker's *current value* — so a choice is
# made by opening the field, swiping one notch, and asserting the value landed
# on. Both occasion pickers here hold exactly two options ("— none —" plus the
# single staged occasion), so one notch is unambiguous. The assert is what keeps
# that non-vacuous.
appId: com.leapsake.app
---
# The per-run tag every record below is stamped with — see the note above.
- evalScript: ${output.run = Date.now() % 1000000}

# ---------------------------------------------------------------- case 1 of 5
# A milestone occasion survives, remapped onto the id the milestone was written
# under.
- runFlow:
    file: subflows/add-person.yaml
    env:
      FIRST: "Casea"
      LAST: "Run${output.run}"
- tapOn: "Add milestone"
- tapOn: "Add" # a dateless Birthday — the wheel makes a month impractical
- assertVisible: ".*Birthday.*"
- runFlow:
    file: subflows/stage-gift-for-occasion.yaml
    env:
      TITLE: "Telescope"
      OCCASION: "Birthday"
- runFlow:
    file: subflows/save-record.yaml
- assertVisible: ".*Given.*Birthday.*"
# The milestone landed on *this* record, not merely somewhere. The gift row above
# says "Given — Birthday" whatever bearer the milestone ended up on, because the
# occasion label resolves by id alone; only the Milestones section proves the
# bearer type was right. The cake distinguishes the two rows.
- assertVisible: "🎂 Birthday"

# ---------------------------------------------------------------- case 2 of 5
# The same, but the milestone is removed before saving: the occasion is dropped
# rather than written against an id that never existed.
- runFlow:
    file: subflows/add-person.yaml
    env:
      FIRST: "Caseb"
      LAST: "Run${output.run}"
- tapOn: "Add milestone"
- tapOn: "Add"
- runFlow:
    file: subflows/stage-gift-for-occasion.yaml
    env:
      TITLE: "Refractor"
      OCCASION: "Birthday"
- scrollUntilVisible:
    element:
      text: "Add milestone"
    direction: UP
# Index 0 is the Milestones section's Remove; Gifts comes later in document order.
- tapOn:
    text: "Remove"
    index: 0
- assertVisible: "No milestones yet."
# The staged row tells the truth immediately: with its only content gone, the
# giving is blank, so the gift reads as a suggestion before it is ever written.
- scrollUntilVisible:
    element:
      text: "Suggestion"
    direction: DOWN
- runFlow:
    file: subflows/save-record.yaml
- assertVisible: "Suggested"
- assertVisible: "No milestones yet."

# ---------------------------------------------------------------- case 3 of 5
# A holiday occasion needs no remap — its id was real all along.
- runFlow:
    file: subflows/add-person.yaml
    env:
      FIRST: "Casec"
      LAST: "Run${output.run}"
- runFlow:
    file: subflows/stage-christmas.yaml
- runFlow:
    file: subflows/stage-gift-for-occasion.yaml
    env:
      TITLE: "Wreath"
      OCCASION: "Christmas (holiday)"
- runFlow:
    file: subflows/save-record.yaml
- assertVisible: ".*Given.*Christmas.*"

# ---------------------------------------------------------------- case 4 of 5
# The holiday is removed before saving. Nothing at write time would catch this —
# only the prune does.
- runFlow:
    file: subflows/add-person.yaml
    env:
      FIRST: "Cased"
      LAST: "Run${output.run}"
- runFlow:
    file: subflows/stage-christmas.yaml
- runFlow:
    file: subflows/stage-gift-for-occasion.yaml
    env:
      TITLE: "Garland"
      OCCASION: "Christmas (holiday)"
- scrollUntilVisible:
    element:
      text: "Add holiday"
    direction: UP
- tapOn:
    text: "Remove"
    index: 0
- assertVisible: "No holidays yet."
- scrollUntilVisible:
    element:
      text: "Suggestion"
    direction: DOWN
- runFlow:
    file: subflows/save-record.yaml
- assertVisible: "Suggested"

# ---------------------------------------------------------------- case 5 of 5
# Case 1 again on the other side of the entity toggle. A pet reaches the same
# machinery by a different route: `bearerType` is "pet" all the way from the
# toggle through `core.milestones.create` to the gift's recipient party, and the
# occasion pool is rebuilt from a pet's own kinds (Birthday, Death, Other — so
# the picker still opens on Birthday). A pet also has no Contacts section, which
# is why nothing here reaches for one.
- runFlow:
    file: subflows/add-pet.yaml
    env:
      NAME: "Casee Run${output.run}"
- tapOn: "Add milestone"
- tapOn: "Add"
- assertVisible: ".*Birthday.*"
- runFlow:
    file: subflows/stage-gift-for-occasion.yaml
    env:
      TITLE: "Chewtoy"
      OCCASION: "Birthday"
- runFlow:
    file: subflows/save-record.yaml
- assertVisible: ".*Given.*Birthday.*"
# The milestone landed on *this* record, not merely somewhere. The gift row above
# says "Given — Birthday" whatever bearer the milestone ended up on, because the
# occasion label resolves by id alone; only the Milestones section proves the
# bearer type was right. The cake distinguishes the two rows.
- assertVisible: "🎂 Birthday"
