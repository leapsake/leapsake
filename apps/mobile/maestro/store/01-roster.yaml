# Populate the app with a presentable roster for store-listing screenshots.
#
# Builds ON the existing store (Mary + George + their Friend edge + the "Send a card"
# reminder) rather than resetting: a reset would destroy that relationship and reminder,
# and the first-run nudges on Home come back afterwards regardless, so it buys nothing.
#
# ## Decisions encoded here
#
#   - **Names are the house convention** — the cast of *It's a Wonderful Life*, full names.
#   - **Birthdays are YEAR ONLY**, staged by subflows/stage-birthday.yaml. Month and day
#     are typed fields too (`milestone-month`, `milestone-day`) if a listing wants them.
#   - **Harry Bailey is the hero record**, not Mary: Mary's birthday reads 1815 from the
#     e2e arc, and the two ambiguous "Edit" links on a person page make correcting it
#     riskier than giving a fresh person a sane year.
#   - **Contact methods and gifts are absent on purpose.** `ContactMethodFields` and
#     `GiftCaptureForm` carry no testIDs for their text inputs, so driving them means
#     text selectors beside unlabelled TextInputs — the fragility the repo's subflows
#     exist to avoid. Those sections stay empty.
#   - **This flow is the ROSTER ONLY.** Reminders live in `02-reminders.yaml` and the hero
#     record's relationship in `03-relationship.yaml`. They were split out when a single
#     long flow wedged partway, and the split is kept deliberately: Maestro commits each
#     save as it goes, so a failure late in one long flow strands you mid-roster with no
#     clean way to resume. Three short flows re-run independently.
appId: com.leapsake.app
---
# --- the roster ----------------------------------------------------------------------
# Eleven more people on top of Mary and George. `save-record.yaml` taps "Not now" when the
# duplicate prompt fires, which the repeated Bailey surname will trigger — that branch is
# why a dozen same-surname people is safe here.

- runFlow:
    file: ../subflows/add-person.yaml
    env:
      FIRST: "Harry"
      LAST: "Bailey"
- runFlow:
    file: ../subflows/stage-birthday.yaml
    env:
      YEAR: "1911"
- runFlow: ../subflows/save-record.yaml

