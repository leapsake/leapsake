# iOS-only prepare flow — settle whatever is in front of the app, then gate on home.
#
# **The load itself is not done here any more.** `scripts/lib/mobile-harness.mjs` opens
# `leapsake://expo-development-client/?url=http://localhost:8081` with `xcrun simctl
# openurl` first — the same deep link the Android driver uses, and now the same on both
# platforms. This flow is what runs *after* it.
#
# It used to drive the dev-launcher's "Continue" instead, because the deep link was
# rejected on iOS when this was written (a SpringBoard confirm, and the launcher ignoring
# the `?url=`; verified 2026-07-18, no longer true as of 2026-08-31). That was the harness's
# one machine-dependent step: "Continue" reopens the last dev server by its *LAN address*,
# so a new DHCP lease left the sim reconnecting to an IP the Mac no longer had, and prepare
# timed out saying only that home never appeared. The harness's comment on `prepare` has
# the detail.
#
# **Do not add `launchApp` back.** Maestro force-stops the app as part of launching it,
# which would discard the bundle the deep link just loaded and drop the sim back on the
# dev-launcher — the exact state this flow cannot get out of on its own.
#
# What is left is resilience: the dev client may still raise a SpringBoard open-confirm
# ("Open") or the RN dev-menu overlay ("Reload"/"Close") over the app, and a launcher
# screen ("Continue") is still worth tapping through if one somehow appears. Each
# `runFlow: when` fires only if that control is present, so the flow tolerates whichever
# subset appears (and their absence) and still converges on the app home. The final
# extendedWaitUntil is the readiness gate the runner relies on: the Search tab is on the
# app home only (absent from the launcher and the dev menu).
#
# iOS-specific and invoked by scripts/lib/mobile-harness.mjs; the assertion itself lives in
# the platform-neutral driver-selftest.yaml, which this flow does not touch.
appId: com.leapsake.app
---
# Dismiss/click-through whatever the dev client shows, in the order it tends to appear.
# Repeated so a second overlay (e.g. the dev menu appearing after the bundle loads) is also
# cleared. Each tap is guarded by `when visible`, so a missing control is simply skipped —
# nothing here fails the flow on its own.
- repeat:
    times: 4
    commands:
      - runFlow:
          when:
            visible: "Open"
          commands:
            - tapOn: "Open"
      - runFlow:
          when:
            visible: "Continue"
          commands:
            - tapOn: "Continue"
      - runFlow:
          when:
            visible: "Reload"
          commands:
            - tapOn: "Close"
      - runFlow:
          when:
            visible: "Close"
          commands:
            - tapOn: "Close"

# Readiness gate: the Search tab is present only on the real app home (not the
# dev-launcher, not the RN dev menu). This absorbs the first Metro bundle build.
#
# **Search rather than Home**, which would be the obvious pick: Home's tab reads "Home"
# but its *title* is "Leapsake", and the dev-launcher shows the app name too — so a Home
# selector could match the launcher and gate on the wrong screen. Search appears nowhere
# but the tab bar. (It replaced People, which was this gate until People stopped being a
# tab.)
#
# The selector is a regex — on iOS the tab's accessibility text is VoiceOver-style
# ("Search, tab, 2 of 4"), not a bare "Search", and Maestro text selectors are
# full-match, so a bare "Search" would never match. `.*Search.*` pins it wherever it sits.
- extendedWaitUntil:
    visible: ".*Search.*"
    timeout: 180000
