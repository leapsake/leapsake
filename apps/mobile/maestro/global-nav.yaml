# The global navigation shell — the tab bar, the New tab, and where Back appears.
#
# Everything here is a claim about *navigation*, which is exactly the class of
# thing no lower tier can check: `lib/new-action.ts` is unit-tested and proves the
# resolver's table, but nothing below E2E proves that the table is wired to a tab
# press, that the press is cancelled before it navigates, or that a back control
# is absent from a tab root and present one screen up.
#
# Four cases, and what each goes red on if the shell regresses:
#
#   1. the bar holds Home, Search, New and Settings — a tab lost or renamed.
#   2. New from Home opens the chooser at all.
#   3. New from a *filtered* Search goes straight into the form, no chooser —
#      break the `?type=` read (or read the tab layout's *local* params instead
#      of the global ones, which is how this was first written) and it falls back
#      to the sheet, so `person-first-name` never appears.
#   4. Back is absent on a tab root and present on a pushed screen — **and this is
#      also what catches a New tab that navigates.** See below.
#
# **Where the "New never navigates" claim is actually proven: case 4, not case 2.**
# Verified by sabotage — deleting the `preventDefault` in `app/(tabs)/_layout.tsx`
# turns this flow red, but on case 4's post-Back assertion, because focus has moved
# to the empty `new` route and Back from the add form therefore lands there rather
# than on the filtered search.
#
# Case 2 used to assert "still on Home" by looking for Home's title behind the
# sheet. That assertion is gone, for two reasons that are each sufficient:
#
#   - **It never worked.** A bottom-tab navigator keeps previously-focused screens
#     **mounted**, merely hidden, so Home's title is still in the accessibility
#     tree after navigating away from it. `assertVisible` on a tab's own content
#     can never tell you that tab is focused.
#   - **It is not portable.** On Android a React Native `Modal` is its own window,
#     so while the sheet is up the screen behind it is not in the tree at all and
#     the assertion fails outright — where on iOS the whole tree is visible. These
#     flows are byte-identical across platforms by design, so an assertion that
#     means different things on each cannot stay.
#
# **What is deliberately not asserted at all: the selected-tab tint.** That is a
# colour, and Maestro reads the accessibility tree rather than pixels. Case 4
# covers the property the colour is a symptom of. If the tint is ever wrong while
# navigation is right, that is a styling bug for a screenshot check, not here.
#
# Like `driver-selftest.yaml` this does not `launchApp`: a cold dev-client launch
# lands on the launcher, and these routes only exist once JS is loaded. Open the
# app to its home screen against a running Metro first.
#
#   maestro --udid <sim> test global-nav.yaml
#
# It creates nothing, so unlike `staged-gift-occasions.yaml` it needs no per-run
# tag. It does need to **clear the search filter it may have left behind**, and it
# does that on the way *in* rather than only on the way out: a run that fails
# anywhere in case 3 leaves the tab narrowed, and the next run then finds a chip
# where it expected tiles and fails for a reason that has nothing to do with the
# code. Cleaning up at the end is not enough when the end is what didn't happen.
#
# The tabs are tapped by **testID** (`tab-home`, `tab-search`, `tab-new`,
# `tab-account`), not by label. A tab's accessibility text is VoiceOver-style on
# iOS ("Search, tab, 2 of 4") and Maestro's text selectors are full-match, so a
# label match has to be a loose `.*New.*` — which would just as happily hit a
# reminder titled "New camera" on the list behind the bar. The labels are still
# *asserted* by regex in case 1, where being loose is harmless; only the taps use
# ids. Everything else asserts on real on-screen text.
appId: com.leapsake.app
---
# Dismiss a sheet left open by an earlier failed run, which would otherwise cover
# the tab bar — on Android a React Native `Modal` is its own window, so nothing
# behind it is even reachable. Same reasoning as the filter guard in case 3:
# a flow has to prepare itself, because the run that leaves the mess is by
# definition the run that didn't reach its cleanup.
- runFlow:
    when:
      visible:
        id: "create-sheet"
    commands:
      - tapOn: "Cancel"

# ------------------------------------------------------------------ case 1 of 4
# Exactly the four standing tabs. Home is asserted by its *title* ("Leapsake")
# rather than its tab label, which also pins that we are on the app home rather
# than anywhere else that happens to have a tab bar.
- tapOn:
    id: "tab-home"
- assertVisible: "Leapsake"
- assertVisible: ".*Search.*"
- assertVisible: ".*New.*"
- assertVisible: ".*Settings.*|.*Account.*"
# No back control on a tab root — the navigator has no back destination to give
# one, so this is the structural half of case 4.
- assertNotVisible: ".*Back.*"

# ------------------------------------------------------------------ case 2 of 4
# Home is about everything, so New has a real question to ask. Nothing here
# asserts that we are *still on Home* — see the header for why that cannot be
# asserted portably, and where the claim is actually proven (case 4).
- tapOn:
    id: "tab-new"
- assertVisible:
    id: "create-sheet"
- tapOn: "Cancel"
- assertNotVisible:
    id: "create-sheet"

# ------------------------------------------------------------------ case 3 of 4
# A search narrowed to People & Pets has already answered "what kind of thing?",
# so New must skip the chooser entirely.
- tapOn:
    id: "tab-search"
# Clear a filter left by an earlier failed run (see the header) so the tiles are
# what is on screen. Guarded, so a clean start simply skips it.
- runFlow:
    when:
      visible:
        id: "search-filter-chip"
    commands:
      - tapOn:
          id: "search-filter-chip"
- tapOn:
    id: "browse-tile-people"
- assertVisible:
    id: "search-filter-chip"
- tapOn:
    id: "tab-new"
- assertNotVisible:
    id: "create-sheet"
# The add person/pet form itself, by the testID the staged-gift flow already
# relies on.
- assertVisible:
    id: "person-first-name"

# ------------------------------------------------------------------ case 4 of 4
# A pushed screen has somewhere to go back to, and says so. This is the same
# screen as case 3 — reached by a push — so the pair is a genuine contrast rather
# than two unrelated screens.
- assertVisible: ".*Back.*"
- tapOn: ".*Back.*"
- assertVisible:
    id: "search-filter-chip"

# Leave the search tab unfiltered so a re-run starts where this one did.
- tapOn:
    id: "search-filter-chip"
- assertNotVisible:
    id: "search-filter-chip"
- assertVisible:
    id: "browse-tile-people"
