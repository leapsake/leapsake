# The global navigation shell — the tab bar, the ➕ each screen carries, and where
# Back appears.
#
# Everything here is a claim about *navigation*, which is exactly the class of
# thing no lower tier can check: nothing below E2E proves that a tab exists, that
# a header's ➕ is wired to the create screen its own tab entry names, that a
# catalog keeps the bar under it, or that a back control is absent from a tab root
# and present one screen up.
#
# Four cases, and what each goes red on if the shell regresses:
#
#   1. the bar holds Home, Search, People and Settings — a tab lost or renamed.
#      This is also the only guard on the fourth tab's name, which used to follow
#      custody and no longer does (`app/(tabs)/menu.tsx`).
#   2. Home's ➕ goes straight into the reminder form. Home is a list of one kind
#      of thing and its create action says so; a ➕ that asked "what are you
#      adding?" here is exactly what this shell replaced.
#   3. People is a **tab**, its ➕ makes a person or pet, and the form it opens is
#      a push that has a Back where the tab under it does not. People spent a
#      while as a hidden catalog behind Search's browse tiles, so "there is a
#      button in the bar that lands on People & Pets" is a claim worth holding.
#   4. a browse tile opens a catalog that has no tab **with the bar still under it
#      and no back control** (the three remaining catalogs are hidden members of
#      the tab navigator, not screens pushed over it — `app/(tabs)/_layout.tsx`),
#      that catalog carries **both** header glyphs, and its 🔍 is what comes back
#      narrowed.
#
# **Cases 3 and 4 together are what hold the single-row header up.**
# `components/AppHeader.tsx` puts a screen's actions on the title's line, which is
# only safe because Back and the 🔍/➕ pair can never occupy that row together —
# Back comes from the native stack, the glyphs are declared only on tab-navigator
# screens. Case 4 is glyphs with no Back; case 3 is Back on the screen pushed over
# them.
#
# **Every assertion here is about something that is either on screen or not
# mounted at all**, and that is a constraint rather than a style. A bottom-tab
# navigator keeps previously-focused screens **mounted**, merely hidden, so their
# text stays in the accessibility tree: `assertVisible` on a tab's own content can
# never tell you that tab is focused, and `assertNotVisible` on it can go red for
# a screen the user left ten taps ago. So arrival is asserted on **pushed** screens
# (a push covers the tabs and a pop unmounts it) and on the tab **bar**, never on
# "is Home's title still somewhere in the tree".
#
# **What is deliberately not asserted at all: the selected-tab tint.** That is a
# colour, and Maestro reads the accessibility tree rather than pixels. If the tint
# is ever wrong while navigation is right, that is a styling bug for a screenshot
# check, not here.
#
# Like `driver-selftest.yaml` this does not `launchApp`: a cold dev-client launch
# lands on the launcher, and these routes only exist once JS is loaded. Open the
# app to its home screen against a running Metro first.
#
#   maestro --udid <sim> test global-nav.yaml
#
# It creates nothing — every form it opens is left by Back — so unlike
# `staged-gifts.yaml` it needs no per-run tag. It does need to **clear the search
# filter it may have left behind**, and it does that on the way *in* rather than
# only on the way out: a run that fails anywhere in case 4 leaves the tab narrowed,
# and the next run then finds a chip where it expected tiles and fails for a reason
# that has nothing to do with the code. Cleaning up at the end is not enough when
# the end is what didn't happen.
#
# The tabs are tapped by **testID** (`tab-home`, `tab-search`, `tab-people`,
# `tab-settings`), not by label. A tab's accessibility text is VoiceOver-style on
# iOS ("Search, tab, 2 of 4") and Maestro's text selectors are full-match, so a
# label match has to be a loose `.*Search.*` — which would just as happily hit a
# reminder titled "Search for a new camera" on the list behind the bar. The labels
# are still *asserted* by regex in case 1, where being loose is harmless; only the
# taps use ids.
#
# The header glyphs are tapped by testID for a stronger reason still: they render
# as a bare ➕ and 🔍, so their only text is the `accessibilityLabel` each one sets.
appId: com.leapsake.app
---
# ------------------------------------------------------------------ case 1 of 4
# Exactly the four standing tabs. Home is asserted by its *title* ("Leapsake")
# rather than its tab label, which also pins that we are on the app home rather
# than anywhere else that happens to have a tab bar.
- tapOn:
    id: "tab-home"
- assertVisible: "Leapsake"
- assertVisible: ".*Search.*"
- assertVisible: ".*People.*"
# Settings in both custody states, signed in or out — the word appears on no other
# screen, so putting the old Settings-or-Account rename back turns this red on a
# device that has an account. Asserted positively rather than by ruling "Account"
# out: that word is a row *inside* this tab (`app/(tabs)/menu.tsx`) and would still
# be in the tree from an earlier visit.
- assertVisible: ".*Settings.*"
# No back control on a tab root — the navigator has no back destination to give
# one, so this is half of the claim case 3 finishes.
- assertNotVisible: ".*Back.*"

# ------------------------------------------------------------------ case 2 of 4
# Home's ➕ makes a reminder and asks nothing on the way. `reminder-title` is the
# form's own field, so nothing short of arriving in the form satisfies it — and
# its *absence* after Back is what proves the push was popped, which "is Home
# visible?" could not (see the header).
- tapOn:
    id: "header-new-home"
- assertVisible:
    id: "reminder-title"
- tapOn: ".*Back.*"
- assertNotVisible:
    id: "reminder-title"

# ------------------------------------------------------------------ case 3 of 4
# People is reachable from the bar, and its own ➕ makes a person or pet. The title
# is asserted between the two taps because the bar's label ("People") and the
# screen's title ("People & Pets") are deliberately different words, and only the
# second one says that a pet belongs in there too.
- tapOn:
    id: "tab-people"
- assertVisible: "People & Pets"
- tapOn:
    id: "header-new-people"
- assertVisible:
    id: "person-first-name"
# A pushed screen has somewhere to go back to and says so — the contrast with case
# 1, on a screen reached from the tab that case 1 checked was absent a Back.
- assertVisible: ".*Back.*"
- tapOn: ".*Back.*"
- assertNotVisible:
    id: "person-first-name"

# ------------------------------------------------------------------ case 4 of 4
# A catalog with no tab of its own. Gifts is reached the way all three now are,
# through a browse tile.
- tapOn:
    id: "tab-search"
# Clear a filter left by an earlier failed run (see the header) so the tiles are
# what is on screen. Guarded, so a clean start simply skips it.
- runFlow:
    when:
      visible:
        id: "search-filter-chip"
    commands:
      - tapOn:
          id: "search-filter-chip"
# A browse tile **leaves for its catalog**; it does not narrow the search in
# place. The chip's absence is the direct statement of that — put the old
# `setParams` back and this line goes red immediately, one tap sooner than the
# rest of the case would notice.
- tapOn:
    id: "browse-tile-gifts"
- assertNotVisible:
    id: "search-filter-chip"
# The catalog **keeps the bar and loses Back** — the two halves of one claim: it
# is a place in the tab navigator, not a screen pushed over it. Move Gifts back
# onto the root stack and the first line goes red (the bar is covered) and the
# second follows (a pushed screen gets a back control for free).
#
# The bar is asserted by a tab's `testID` rather than its label, for the reason
# in the header.
- assertVisible:
    id: "tab-home"
- assertNotVisible: ".*Back.*"
# Both glyphs, sharing the one right-hand slot. Drop either and the header is
# quietly back to a single action. This is also what proves the tile landed us on
# Gifts, since `search-here-gifts` exists nowhere else.
- assertVisible:
    id: "search-here-gifts"
- assertVisible:
    id: "header-new-gifts"
# Narrowing comes from the catalog's own 🔍, and from nowhere else.
- tapOn:
    id: "search-here-gifts"
- assertVisible:
    id: "search-filter-chip"

# Leave the search tab unfiltered so a re-run starts where this one did.
- tapOn:
    id: "search-filter-chip"
- assertNotVisible:
    id: "search-filter-chip"
- assertVisible:
    id: "browse-tile-people"
